<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MusicDownloader – Video & Audio Downloader | MediaForge</title>

<meta
    name="description"
    content="MusicDownloader von MediaForge: Öffentliche Videos und Audios unterstützter Plattformen in MP3, MP4, M4A, WAV, FLAC und weiteren Formaten umwandeln."
>
<link rel="canonical" href="https://mediaforge-downloader.onrender.com/">
<meta
    name="robots"
    content="index, follow"
>

<meta
    name="googlebot"
    content="index, follow"
>

<link
    rel="canonical"
    href="https://mediaforge-downloader.onrender.com/"
>

<meta
    property="og:title"
    content="MusicDownloader – MediaForge"
>

<meta
    property="og:description"
    content="MediaForge MusicDownloader für öffentliche Videos und Audios."
>

<meta
    property="og:type"
    content="website"
>

<meta
    property="og:url"
    content="https://mediaforge-downloader.onrender.com/"
>

<meta
    property="og:site_name"
    content="MediaForge"
>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #080b12,
                    #111827,
                    #05070c
                );
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .card {
            background: rgba(20, 25, 38, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.45);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .logo span {
            color: #7c3aed;
        }

        .subtitle {
            text-align: center;
            color: #aeb6c8;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input,
        select {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #30384b;
            background: #0d1220;
            color: white;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
        }

        input:focus,
        select:focus {
            border-color: #7c3aed;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 17px;
            background: #7c3aed;
            color: white;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #6d28d9;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .progress-box {
            margin-top: 25px;
            display: none;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        .progress {
            width: 100%;
            height: 12px;
            background: #20283a;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #7c3aed;
            transition: width 0.3s;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            display: none;
            line-height: 1.5;
        }

        .success {
            background: rgba(34,197,94,0.12);
            border: 1px solid rgba(34,197,94,0.3);
            color: #86efac;
        }

        .error {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5;
        }

        .info {
            background: rgba(59,130,246,0.12);
            border: 1px solid rgba(59,130,246,0.3);
            color: #93c5fd;
        }

        .download-button {
            display: none;
            margin-top: 15px;
            text-align: center;
            text-decoration: none;
            background: #16a34a;
            color: white;
            padding: 16px;
            border-radius: 14px;
            font-weight: 800;
        }

        .download-button:hover {
            background: #15803d;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #737d91;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            .card {
                padding: 25px 20px;
            }

            .logo {
                font-size: 34px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            Media<span>Forge</span>
        </div>

        <div class="subtitle">
            Music & Media Downloader
        </div>

        <label for="url">
            Video- oder Medien-URL
        </label>

        <input
            id="url"
            type="url"
            placeholder="YouTube- oder TikTok-Link einfügen..."
            autocomplete="off"
        >

        <div class="row">

            <div>
                <label for="format">
                    Format
                </label>

                <select id="format">

                    <option value="mp3">
                        MP3
                    </option>

                    <option value="mp4">
                        MP4
                    </option>

                    <option value="m4a">
                        M4A
                    </option>

                    <option value="wav">
                        WAV
                    </option>

                    <option value="flac">
                        FLAC
                    </option>

                    <option value="aac">
                        AAC
                    </option>

                    <option value="ogg">
                        OGG
                    </option>

                </select>
            </div>

            <div>

                <label for="quality">
                    Audioqualität
                </label>

                <select id="quality">

                    <option value="128">
                        128 kbps
                    </option>

                    <option value="192" selected>
                        192 kbps
                    </option>

                    <option value="256">
                        256 kbps
                    </option>

                    <option value="320">
                        320 kbps
                    </option>

                </select>

            </div>

        </div>

        <label for="filename">
            Dateiname
        </label>

        <input
            id="filename"
            type="text"
            placeholder="mediaforge-download"
            value="mediaforge-download"
        >

        <button
            id="downloadBtn"
            onclick="startDownload()"
        >
            ⬇️ Download starten
        </button>

        <div
            id="progressBox"
            class="progress-box"
        >

            <div class="progress-text">

                <span id="progressStatus">
                    Download wird vorbereitet...
                </span>

                <span id="progressPercent">
                    0%
                </span>

            </div>

            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>

            </div>

        </div>

        <div
            id="message"
            class="message"
        ></div>

        <a
            id="downloadLink"
            class="download-button"
            target="_blank"
            rel="noopener"
        >
            ⬇️ Datei herunterladen
        </a>

    </div>

    <div class="footer">
        MediaForge © 2026
    </div>

</div>


<script>

/* =========================================================
   DEIN NEUES BACKEND
========================================================= */

const API_URL =
    "https://musicdownloader-api-2.onrender.com";


/* =========================================================
   ELEMENTE
========================================================= */

const urlInput =
    document.getElementById("url");

const formatInput =
    document.getElementById("format");

const qualityInput =
    document.getElementById("quality");

const filenameInput =
    document.getElementById("filename");

const downloadBtn =
    document.getElementById("downloadBtn");

const progressBox =
    document.getElementById("progressBox");

const progressBar =
    document.getElementById("progressBar");

const progressPercent =
    document.getElementById("progressPercent");

const progressStatus =
    document.getElementById("progressStatus");

const message =
    document.getElementById("message");

const downloadLink =
    document.getElementById("downloadLink");


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type
) {

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display =
        "block";
}


/* =========================================================
   PROGRESS
========================================================= */

function setProgress(
    percent,
    status
) {

    progressBox.style.display =
        "block";

    progressBar.style.width =
        percent + "%";

    progressPercent.textContent =
        percent + "%";

    progressStatus.textContent =
        status;
}


/* =========================================================
   DOWNLOAD
========================================================= */

async function startDownload() {

    const url =
        urlInput.value.trim();

    const format =
        formatInput.value;

    const quality =
        qualityInput.value;

    const filename =
        filenameInput.value.trim() ||
        "mediaforge-download";


    /* -----------------------------------------------------
       URL PRÜFEN
    ----------------------------------------------------- */

    if (!url) {

        showMessage(
            "Bitte zuerst eine URL einfügen.",
            "error"
        );

        return;
    }


    /* -----------------------------------------------------
       RESET
    ----------------------------------------------------- */

    message.style.display =
        "none";

    downloadLink.style.display =
        "none";

    downloadBtn.disabled =
        true;


    setProgress(
        5,
        "Verbindung zum Server..."
    );


    try {

        /* -------------------------------------------------
           SERVER TEST
        ------------------------------------------------- */

        


        


        setProgress(
            10,
            "Server bereit. Download wird gestartet..."
        );


        /* -------------------------------------------------
           FORM DATA
        ------------------------------------------------- */

        const formData =
            new FormData();

        formData.append(
            "url",
            url
        );

        formData.append(
            "format",
            format
        );

        formData.append(
            "audioQuality",
            quality
        );

        formData.append(
            "filename",
            filename
        );

        formData.append(
            "normalizeAudio",
            "false"
        );

        formData.append(
            "removeMetadata",
            "false"
        );


        /* -------------------------------------------------
           DOWNLOAD
        ------------------------------------------------- */

        setProgress(
            15,
            "Medienquelle wird verarbeitet..."
        );


        const response =
            await fetch(
                API_URL + "/api/convert",
                {
                    method: "POST",
                    body: formData
                }
            );


        setProgress(
            70,
            "Datei wird verarbeitet..."
        );


        let data;

        try {

            data =
                await response.json();

        } catch {

            throw new Error(
                "Der Server hat keine gültige Antwort zurückgegeben."
            );
        }


        /* -------------------------------------------------
           SERVER FEHLER
        ------------------------------------------------- */

        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Der Download ist fehlgeschlagen."
            );
        }


        /* -------------------------------------------------
           ERFOLG
        ------------------------------------------------- */

        setProgress(
            100,
            "Download fertig!"
        );


        showMessage(
            `Fertig! Datei: ${data.filename} (${data.size})`,
            "success"
        );


        downloadLink.href =
            data.downloadUrl;

        downloadLink.download =
            data.filename;

        downloadLink.style.display =
            "block";


    } catch (error) {

        console.error(
            "MediaForge Fehler:",
            error
        );


        setProgress(
            0,
            "Download fehlgeschlagen"
        );


        showMessage(
            error.message ||
            "Unbekannter Fehler.",
            "error"
        );


    } finally {

        downloadBtn.disabled =
            false;

    }

}


/* =========================================================
   ENTER
========================================================= */

urlInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            startDownload();

        }

    }
);

</script>

</body>
</html>
